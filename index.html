<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rayhan's English Academy</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- React & Babel -->
    <script src="https://unpkg.com/react@18/umd/react.development.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js" crossorigin></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>
<body class="bg-slate-50 text-slate-800 antialiased">
    
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef } = React;

        // Custom Hook for Local Storage (To save data without Firebase)
        function useLocalStorage(key, initialValue) {
            const [value, setValue] = useState(() => {
                const saved = window.localStorage.getItem(key);
                if (saved !== null) {
                    return JSON.parse(saved);
                }
                return initialValue;
            });

            useEffect(() => {
                window.localStorage.setItem(key, JSON.stringify(value));
            }, [key, value]);

            return [value, setValue];
        }

        // Icons (Using Emojis for zero dependency)
        const BookOpen = () => <span className="text-xl">📖</span>;
        const Users = () => <span className="text-xl">👥</span>;
        const Plus = () => <span>➕</span>;
        const LogOut = () => <span>🚪</span>;
        const Shield = () => <span>🛡️</span>;
        const ShieldAlert = () => <span>⚠️</span>;
        const CheckCircle = () => <span>✅</span>;
        const ArrowLeft = () => <span className="text-xl">⬅️</span>;
        const PhoneCall = () => <span>📞</span>;
        const Send = () => <span>📤</span>;
        const Paperclip = () => <span>📎</span>;
        const MoreVertical = () => <span>⋮</span>;
        const PhoneOff = () => <span>❌</span>;
        const Mic = () => <span>🎤</span>;
        const MicOff = () => <span>🔇</span>;

        // ==========================================
        // 1. HOME / DASHBOARD COMPONENT
        // ==========================================
        function HomeView({ navigate, groups, setGroups, topic }) {
          
          const handleCreateGroup = () => {
            const groupName = prompt("নতুন গ্রুপের নাম দিন (যেমন: Grammar Practice):");
            if(groupName && groupName.trim() !== '') {
              const newGroup = { 
                id: 'group-' + Date.now(), 
                name: groupName, 
                members: 1, 
                unread: 0 
              };
              setGroups([newGroup, ...groups]);
              alert(`"${groupName}" গ্রুপটি তৈরি হয়েছে এবং সেভ হয়েছে!`);
            }
          };

          const handleJoinGroup = () => {
             const code = prompt("গ্রুপের নাম বা কোড দিন:");
             if(code) {
                 alert(`আপনি "${code}" গ্রুপে জয়েন রিকুয়েস্ট পাঠিয়েছেন!`);
             }
          };

          return (
            <div className="min-h-screen bg-slate-50 flex flex-col md:flex-row">
              {/* Sidebar */}
              <nav className="w-full md:w-72 bg-white border-r border-slate-200 p-5 flex flex-col justify-between shadow-sm z-10 sticky top-0 md:h-screen">
                <div>
                  <div className="flex items-center gap-3 mb-8">
                    <div className="bg-blue-600 p-2 rounded-xl flex items-center justify-center w-10 h-10 text-white shadow-md">
                      <BookOpen />
                    </div>
                    <div>
                      <h1 className="font-bold text-xl leading-tight text-blue-900">Rayhan's</h1>
                      <p className="text-xs text-slate-500 font-bold tracking-wide">ENGLISH ACADEMY</p>
                    </div>
                  </div>
                  
                  <button onClick={handleCreateGroup} className="w-full bg-blue-600 hover:bg-blue-700 text-white font-medium py-3 px-4 rounded-xl flex items-center justify-center gap-2 mb-3 transition-all shadow-md shadow-blue-200">
                    <Plus /> Create Group
                  </button>
                  
                  <button onClick={handleJoinGroup} className="w-full bg-white border border-slate-200 hover:bg-slate-50 text-slate-700 font-medium py-3 px-4 rounded-xl flex items-center justify-center gap-2 mb-8 transition-all">
                    <Users /> Join Group
                  </button>

                  <h3 className="text-sm font-semibold text-slate-400 uppercase tracking-wider mb-3">My Groups</h3>
                  <div className="space-y-2 overflow-y-auto max-h-[40vh] pr-2">
                    {groups.length === 0 && <p className="text-xs text-slate-400 text-center py-4">No groups yet.</p>}
                    {groups.map(g => (
                      <button 
                        key={g.id} 
                        onClick={() => navigate('group', g.id, g.name)}
                        className="w-full text-left flex items-center justify-between p-3 rounded-xl hover:bg-blue-50 transition-colors border border-slate-100 hover:border-blue-200 group"
                      >
                        <div className="flex items-center gap-3">
                          <div className="w-10 h-10 rounded-full bg-blue-100 flex items-center justify-center text-blue-600 font-bold shrink-0">
                            {g.name.charAt(0).toUpperCase()}
                          </div>
                          <div className="overflow-hidden">
                            <p className="text-sm font-bold text-slate-700 group-hover:text-blue-700 truncate">{g.name}</p>
                            <p className="text-xs text-slate-500">{g.members} members</p>
                          </div>
                        </div>
                        {g.unread > 0 && (
                          <span className="bg-red-500 text-white text-[10px] font-bold px-2 py-0.5 rounded-full">{g.unread}</span>
                        )}
                      </button>
                    ))}
                  </div>
                </div>

                <div className="mt-8 border-t border-slate-100 pt-5 space-y-4">
                  <button onClick={() => navigate('admin')} className="w-full flex items-center gap-2 text-sm font-bold text-purple-600 hover:bg-purple-50 p-3 rounded-xl transition-colors border border-purple-100">
                    <Shield /> Admin Dashboard
                  </button>
                  <div className="flex items-center gap-3 bg-slate-50 border border-slate-200 p-3 rounded-xl">
                    <img src="https://ui-avatars.com/api/?name=Student&background=random" className="w-10 h-10 rounded-full" alt="Profile" />
                    <div className="flex-1 overflow-hidden">
                      <p className="text-sm font-bold text-slate-800 truncate">John Doe</p>
                      <p className="text-xs text-slate-500">Student</p>
                    </div>
                    <button className="text-slate-400 hover:text-red-500"><LogOut /></button>
                  </div>
                </div>
              </nav>

              {/* Main Content Area */}
              <main className="flex-1 p-5 md:p-10 overflow-y-auto">
                <header className="mb-8">
                  <h2 className="text-2xl md:text-3xl font-bold text-slate-800">Welcome back, John! 👋</h2>
                  <p className="text-slate-500 mt-2">Ready to practice your spoken English today?</p>
                </header>

                <section className="bg-white rounded-3xl shadow-sm border border-blue-200 p-6 md:p-8 mb-8 relative overflow-hidden">
                  <div className="absolute top-0 right-0 w-40 h-40 bg-blue-50 rounded-bl-full -z-10"></div>
                  <div className="flex items-center gap-2 text-blue-600 font-bold mb-3">
                    <BookOpen />
                    <span>Today’s Conversation Topic</span>
                  </div>
                  <h3 className="text-2xl font-bold text-slate-800 mb-5">{topic.title}</h3>
                  
                  <div className="bg-slate-50 border border-slate-100 p-5 rounded-2xl">
                    <p className="text-sm font-semibold text-slate-600 mb-4">Discuss these questions with your group members:</p>
                    <ul className="space-y-3">
                      {topic.questions.map((q, idx) => q && (
                        <li key={idx} className="flex gap-3 text-slate-700 text-sm md:text-base items-start">
                          <span className="font-bold text-blue-500 bg-blue-100 w-6 h-6 rounded-full flex items-center justify-center shrink-0">{idx + 1}</span> 
                          <span className="mt-0.5">{q}</span>
                        </li>
                      ))}
                    </ul>
                  </div>
                </section>
              </main>
            </div>
          );
        }

        // ==========================================
        // 2. GROUP CHAT & VOICE ROOM COMPONENT
        // ==========================================
        function GroupRoomView({ navigate, groupId, groupName, allMessages, setAllMessages }) {
          const [message, setMessage] = useState('');
          const [voiceActive, setVoiceActive] = useState(false);
          const endRef = useRef(null);
          
          // Get messages for THIS specific group, or empty array if none
          const messages = allMessages[groupId] || [];

          useEffect(() => {
            endRef.current?.scrollIntoView({ behavior: "smooth" });
          }, [messages]);

          const handleSend = (e) => {
            e.preventDefault();
            if (!message.trim()) return;
            
            const newMessage = { 
              id: Date.now(), 
              text: message, 
              sender: 'You', 
              time: new Date().toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'}), 
              isMe: true 
            };

            // Save message to the specific group
            setAllMessages(prev => ({
                ...prev,
                [groupId]: [...(prev[groupId] || []), newMessage]
            }));

            setMessage('');
          };

          return (
            <div className="flex h-screen bg-slate-50">
              <div className="flex-1 flex flex-col max-w-4xl mx-auto bg-white shadow-xl shadow-slate-200/50 relative border-x border-slate-200">
                
                {/* Header */}
                <header className="h-20 border-b border-slate-200 px-4 md:px-6 flex items-center justify-between bg-white z-10">
                  <div className="flex items-center gap-3 md:gap-4">
                    <button onClick={() => navigate('home')} className="w-10 h-10 bg-slate-100 hover:bg-slate-200 rounded-full text-slate-600 transition-colors shrink-0 flex items-center justify-center">
                      <ArrowLeft />
                    </button>
                    <div className="w-10 h-10 md:w-12 md:h-12 rounded-full bg-blue-100 flex items-center justify-center text-blue-600 font-bold text-lg shrink-0">
                      {groupName ? groupName.charAt(0).toUpperCase() : 'G'}
                    </div>
                    <div className="overflow-hidden">
                      <h2 className="font-bold text-slate-800 text-base md:text-lg truncate">{groupName}</h2>
                      <p className="text-xs text-green-500 font-bold flex items-center gap-1.5 mt-0.5">
                        <span className="w-2 h-2 rounded-full bg-green-500 animate-pulse"></span> Active Now
                      </p>
                    </div>
                  </div>
                  
                  <div className="flex items-center gap-2 md:gap-3 shrink-0">
                    <button 
                      onClick={() => setVoiceActive(true)}
                      className="bg-green-500 hover:bg-green-600 text-white px-4 md:px-5 py-2 md:py-2.5 rounded-full font-bold flex items-center gap-2 text-sm transition-all shadow-md shadow-green-200">
                      <PhoneCall /> <span className="hidden md:inline">Voice Join</span>
                    </button>
                  </div>
                </header>

                {/* Chat Display */}
                <div className="flex-1 overflow-y-auto p-4 md:p-6 space-y-5 bg-slate-50/50" style={{ backgroundImage: "url('https://www.transparenttextures.com/patterns/cubes.png')" }}>
                  {messages.length === 0 && (
                      <div className="flex flex-col items-center justify-center h-full opacity-50">
                          <span className="text-4xl mb-2">👋</span>
                          <p className="text-slate-500 font-medium">Send a message to start practicing!</p>
                      </div>
                  )}
                  {messages.map(msg => (
                    <div key={msg.id} className={`flex flex-col ${msg.isMe ? 'items-end' : 'items-start'}`}>
                      {!msg.isMe && <span className="text-xs font-semibold text-slate-500 ml-2 mb-1">{msg.sender}</span>}
                      <div className={`max-w-[85%] md:max-w-[65%] px-5 py-3 rounded-2xl text-[15px] shadow-sm ${
                        msg.isMe ? 'bg-blue-600 text-white rounded-br-sm' : 'bg-white border border-slate-200 text-slate-800 rounded-bl-sm'
                      }`}>
                        {msg.text}
                      </div>
                      <span className="text-[10px] font-medium text-slate-400 mt-1 mx-2">{msg.time}</span>
                    </div>
                  ))}
                  <div ref={endRef} />
                </div>

                {/* Message Input */}
                <footer className="p-4 bg-white border-t border-slate-200">
                  <form onSubmit={handleSend} className="flex items-center gap-2 md:gap-3">
                    <button type="button" className="p-2 md:p-3 text-slate-400 hover:text-blue-600 bg-slate-50 hover:bg-blue-50 rounded-full transition-all shrink-0"><Paperclip/></button>
                    <input 
                      type="text" 
                      value={message}
                      onChange={(e) => setMessage(e.target.value)}
                      placeholder="Type a message..." 
                      className="flex-1 bg-slate-100 text-slate-800 rounded-full px-5 py-3 outline-none focus:ring-2 focus:ring-blue-500/20 focus:bg-white border border-transparent focus:border-blue-500 transition-all text-sm md:text-base font-medium"
                    />
                    {message.trim() ? (
                      <button type="submit" className="p-3 md:p-4 bg-blue-600 text-white rounded-full hover:bg-blue-700 transition-colors shadow-md shadow-blue-200 shrink-0">
                        <Send />
                      </button>
                    ) : (
                      <button type="button" className="p-3 md:p-4 bg-slate-100 text-slate-600 rounded-full hover:bg-slate-200 transition-colors shrink-0">
                        <Mic />
                      </button>
                    )}
                  </form>
                </footer>
              </div>

              {/* Voice Room Popup UI */}
              {voiceActive && (
                <div className="absolute inset-0 z-50 flex items-center justify-center bg-slate-900/70 backdrop-blur-sm p-4">
                  <div className="bg-white w-full max-w-md rounded-3xl shadow-2xl overflow-hidden flex flex-col">
                    <div className="bg-blue-600 p-6 text-center">
                      <h3 className="text-white font-bold text-xl mb-1">Live Voice Room</h3>
                      <p className="text-blue-200 text-sm font-medium">{groupName}</p>
                    </div>
                    
                    <div className="p-8 flex-1 bg-slate-50 flex flex-col items-center justify-center py-12">
                       <div className="w-24 h-24 rounded-full bg-slate-200 border-4 border-white shadow-lg flex items-center justify-center text-4xl mb-4 relative">
                           👨‍🎓
                           <span className="absolute bottom-0 right-0 bg-green-500 p-1.5 rounded-full text-white text-xs"><Mic/></span>
                       </div>
                       <p className="font-bold text-slate-700">You</p>
                       <p className="text-xs text-green-600 font-bold mt-2 animate-pulse">Connected to Room...</p>
                    </div>

                    <div className="p-6 bg-white border-t border-slate-100 flex items-center justify-center gap-6">
                      <button onClick={() => setVoiceActive(false)} className="w-full py-4 bg-red-500 hover:bg-red-600 text-white rounded-2xl font-bold shadow-lg shadow-red-200 flex items-center justify-center gap-2 transition-all">
                        <PhoneOff/> Disconnect
                      </button>
                    </div>
                  </div>
                </div>
              )}
            </div>
          );
        }

        // ==========================================
        // 3. ADMIN / TEACHER COMPONENT
        // ==========================================
        function AdminView({ navigate, topic, setTopic }) {
          const [tempTopic, setTempTopic] = useState(topic.title);
          const [tempQ, setTempQ] = useState(topic.questions);
          const [success, setSuccess] = useState(false);

          const handlePublish = (e) => {
            e.preventDefault();
            // Save to local storage state
            setTopic({ title: tempTopic, questions: tempQ });
            setSuccess(true);
            setTimeout(() => setSuccess(false), 3000);
          };

          return (
            <div className="min-h-screen bg-slate-50 p-5 md:p-10">
              <div className="max-w-4xl mx-auto">
                <header className="mb-10 flex flex-col md:flex-row md:items-center justify-between gap-4">
                  <div className="flex items-center gap-4">
                    <button onClick={() => navigate('home')} className="bg-white w-12 h-12 rounded-full shadow-sm hover:bg-slate-100 transition-colors shrink-0 flex items-center justify-center">
                      <ArrowLeft />
                    </button>
                    <div>
                      <h1 className="text-2xl md:text-3xl font-bold text-slate-800">Teacher Dashboard</h1>
                      <p className="text-slate-500 font-medium text-sm md:text-base">Manage Academy Content</p>
                    </div>
                  </div>
                  <div className="bg-purple-100 text-purple-700 px-5 py-2.5 rounded-xl font-bold text-sm inline-flex items-center gap-2 w-max shadow-sm">
                    <ShieldAlert /> Admin Access
                  </div>
                </header>

                <div className="bg-white p-6 md:p-8 rounded-3xl shadow-sm border border-slate-200">
                  <h2 className="text-xl font-bold mb-6 flex items-center gap-2"><BookOpen /> Update Daily Topic</h2>
                  <form onSubmit={handlePublish} className="space-y-6">
                    <div>
                      <label className="block text-sm font-bold text-slate-700 mb-2">Topic Title</label>
                      <input 
                        type="text" 
                        className="w-full bg-slate-50 border border-slate-200 rounded-xl px-4 py-3 outline-none focus:ring-2 focus:ring-blue-500/20 focus:border-blue-500 font-medium"
                        value={tempTopic}
                        onChange={(e) => setTempTopic(e.target.value)}
                        required
                      />
                    </div>
                    
                    <div>
                      <label className="block text-sm font-bold text-slate-700 mb-2">Discussion Questions</label>
                      {tempQ.map((q, index) => (
                        <div key={index} className="flex gap-2 md:gap-3 mb-3">
                          <span className="bg-slate-100 text-slate-500 w-10 md:w-12 shrink-0 rounded-xl flex items-center justify-center font-bold text-sm">{index + 1}</span>
                          <input 
                            type="text" 
                            className="flex-1 bg-slate-50 border border-slate-200 rounded-xl px-4 py-3 outline-none focus:ring-2 focus:ring-blue-500/20 focus:border-blue-500 font-medium"
                            value={q}
                            onChange={(e) => {
                              const newQ = [...tempQ];
                              newQ[index] = e.target.value;
                              setTempQ(newQ);
                            }}
                          />
                        </div>
                      ))}
                      <button type="button" onClick={() => setTempQ([...tempQ, ''])} className="text-sm text-blue-600 font-bold hover:underline mt-2 inline-block">
                        + Add another question
                      </button>
                    </div>

                    <button type="submit" className={`w-full font-bold py-4 rounded-xl transition-all flex items-center justify-center gap-2 ${success ? 'bg-green-500 hover:bg-green-600' : 'bg-blue-600 hover:bg-blue-700'} text-white shadow-lg`}>
                      {success ? <CheckCircle /> : null}
                      {success ? 'Topic Updated Successfully!' : 'Publish Topic to All Groups'}
                    </button>
                  </form>
                </div>
              </div>
            </div>
          );
        }

        // ==========================================
        // 4. MAIN APP ROUTER (Central State)
        // ==========================================
        function App() {
          const [currentView, setCurrentView] = useState('home');
          const [currentGroup, setCurrentGroup] = useState({ id: null, name: '' });

          // --- PERSISTENT DATA (Saved in Browser automatically) ---
          
          // 1. Save Groups
          const [groups, setGroups] = useLocalStorage('rayhan_groups', [
            { id: 'g1', name: 'Beginner Spoken English', members: 12, unread: 0 },
            { id: 'g2', name: 'IELTS Speaking Practice', members: 8, unread: 0 },
          ]);

          // 2. Save Messages (Object mapping groupId to array of messages)
          const [allMessages, setAllMessages] = useLocalStorage('rayhan_messages', {
             'g1': [
                 { id: 1, text: "Welcome to Beginner Spoken English!", sender: 'Admin', time: '10:00 AM', isMe: false }
             ]
          });

          // 3. Save Daily Topic
          const [topic, setTopic] = useLocalStorage('rayhan_topic', {
            title: "My Daily Routine",
            questions: [
              "What time do you wake up?",
              "What do you do in the morning?",
              "When do you go to work or school?",
              "What do you do in the evening?"
            ]
          });

          // Custom Router Navigation
          const navigate = (view, groupId = null, groupName = '') => {
            if (view === 'group') {
              setCurrentGroup({ id: groupId, name: groupName });
            }
            setCurrentView(view);
          };

          return (
            <React.Fragment>
              {currentView === 'home' && (
                <HomeView 
                  navigate={navigate} 
                  groups={groups} 
                  setGroups={setGroups} 
                  topic={topic} 
                />
              )}
              {currentView === 'group' && (
                <GroupRoomView 
                  navigate={navigate} 
                  groupId={currentGroup.id} 
                  groupName={currentGroup.name}
                  allMessages={allMessages}
                  setAllMessages={setAllMessages}
                />
              )}
              {currentView === 'admin' && (
                <AdminView 
                  navigate={navigate} 
                  topic={topic} 
                  setTopic={setTopic} 
                />
              )}
            </React.Fragment>
          );
        }

        // Render App
        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
