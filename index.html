<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rayhan's English Academy</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/react@18/umd/react.development.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js" crossorigin></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>
<body class="bg-slate-50 text-slate-800 antialiased">
    
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef } = React;

        // Icons
        const BookOpen = () => <span className="text-xl">📖</span>;
        const Users = () => <span className="text-xl">👥</span>;
        const Plus = () => <span>➕</span>;
        const LogOut = () => <span>🚪</span>;
        const Shield = () => <span>🛡️</span>;
        const ShieldAlert = () => <span>⚠️</span>;
        const CheckCircle = () => <span>✅</span>;
        const ArrowLeft = () => <span className="text-xl">⬅️</span>;
        const PhoneCall = () => <span>📞</span>;
        const Send = () => <span>📤</span>;
        const Paperclip = () => <span>📎</span>;
        const MoreVertical = () => <span>⋮</span>;
        const PhoneOff = () => <span>❌</span>;
        const Mic = () => <span>🎤</span>;
        const MicOff = () => <span>🔇</span>;

        // ==========================================
        // 1. HOME / DASHBOARD COMPONENT
        // ==========================================
        function HomeView({ navigate, groups, setGroups }) {
          const dailyTopic = {
            title: "My Daily Routine",
            questions: [
              "What time do you wake up?",
              "What do you do in the morning?",
              "When do you go to work or school?",
              "What do you do in the evening?",
              "What time do you go to bed?"
            ]
          };

          // Demo Function: Create Group
          const handleCreateGroup = () => {
            const groupName = prompt("নতুন গ্রুপের নাম দিন (যেমন: Advanced Grammar):");
            if(groupName) {
              const newGroup = { id: Date.now().toString(), name: groupName, members: 1, unread: 0 };
              setGroups([...groups, newGroup]);
              alert(`"${groupName}" গ্রুপটি তৈরি হয়েছে!`);
            }
          };

          // Demo Function: Join Group
          const handleJoinGroup = () => {
            const groupCode = prompt("যে গ্রুপে জয়েন করতে চান তার কোড বা নাম দিন:");
            if(groupCode) {
              const newGroup = { id: Date.now().toString(), name: groupCode, members: 5, unread: 0 };
              setGroups([...groups, newGroup]);
              alert(`আপনি "${groupCode}" গ্রুপে জয়েন করেছেন!`);
            }
          };

          return (
            <div className="min-h-screen bg-slate-50 flex flex-col md:flex-row">
              {/* Sidebar */}
              <nav className="w-full md:w-72 bg-white border-r border-slate-200 p-5 flex flex-col justify-between shadow-sm z-10 sticky top-0 md:h-screen">
                <div>
                  <div className="flex items-center gap-3 mb-8">
                    <div className="bg-blue-600 p-2 rounded-xl flex items-center justify-center w-10 h-10 text-white">
                      <BookOpen />
                    </div>
                    <div>
                      <h1 className="font-bold text-xl leading-tight text-blue-900">Rayhan's</h1>
                      <p className="text-xs text-slate-500 font-medium tracking-wide">ENGLISH ACADEMY</p>
                    </div>
                  </div>
                  
                  <button onClick={handleCreateGroup} className="w-full bg-blue-600 hover:bg-blue-700 text-white font-medium py-3 px-4 rounded-xl flex items-center justify-center gap-2 mb-3 transition-all shadow-md shadow-blue-200">
                    <Plus /> Create Group
                  </button>
                  
                  <button onClick={handleJoinGroup} className="w-full bg-white border border-slate-200 hover:bg-slate-50 text-slate-700 font-medium py-3 px-4 rounded-xl flex items-center justify-center gap-2 mb-8 transition-all">
                    <Users /> Join Group
                  </button>

                  <h3 className="text-sm font-semibold text-slate-400 uppercase tracking-wider mb-3">My Groups</h3>
                  <div className="space-y-2">
                    {groups.map(g => (
                      <button 
                        key={g.id} 
                        onClick={() => navigate('group', g.id, g.name)}
                        className="w-full text-left flex items-center justify-between p-3 rounded-xl hover:bg-blue-50 transition-colors border border-transparent hover:border-blue-100 group"
                      >
                        <div className="flex items-center gap-3">
                          <div className="w-10 h-10 rounded-full bg-blue-100 flex items-center justify-center text-blue-600 font-bold shrink-0">
                            {g.name.charAt(0)}
                          </div>
                          <div>
                            <p className="text-sm font-bold text-slate-700 group-hover:text-blue-700 truncate">{g.name}</p>
                            <p className="text-xs text-slate-500">{g.members} members</p>
                          </div>
                        </div>
                        {g.unread > 0 && (
                          <span className="bg-red-500 text-white text-[10px] font-bold px-2 py-0.5 rounded-full">{g.unread}</span>
                        )}
                      </button>
                    ))}
                  </div>
                </div>

                <div className="mt-8 border-t border-slate-100 pt-5 space-y-4">
                  <button onClick={() => navigate('admin')} className="w-full flex items-center gap-2 text-sm font-semibold text-purple-600 hover:bg-purple-50 p-2 rounded-lg transition-colors">
                    <Shield /> Admin Panel
                  </button>
                  <div className="flex items-center gap-3 bg-slate-50 p-3 rounded-xl">
                    <img src="https://ui-avatars.com/api/?name=Student&background=random" className="w-10 h-10 rounded-full" alt="Profile" />
                    <div className="flex-1 overflow-hidden">
                      <p className="text-sm font-bold text-slate-800 truncate">John Doe</p>
                      <p className="text-xs text-slate-500">Student</p>
                    </div>
                    <button className="text-slate-400 hover:text-red-500"><LogOut /></button>
                  </div>
                </div>
              </nav>

              {/* Main Content Area */}
              <main className="flex-1 p-5 md:p-10 overflow-y-auto">
                <header className="mb-8">
                  <h2 className="text-2xl md:text-3xl font-bold text-slate-800">Welcome back, John! 👋</h2>
                  <p className="text-slate-500 mt-2">Ready to practice your spoken English today?</p>
                </header>

                <section className="bg-white rounded-3xl shadow-sm border border-blue-100 p-6 md:p-8 mb-8 relative overflow-hidden">
                  <div className="absolute top-0 right-0 w-40 h-40 bg-blue-50 rounded-bl-full -z-10"></div>
                  <div className="flex items-center gap-2 text-blue-600 font-bold mb-3">
                    <BookOpen />
                    <span>Today’s Conversation Topic</span>
                  </div>
                  <h3 className="text-2xl font-bold text-slate-800 mb-5">{dailyTopic.title}</h3>
                  
                  <div className="bg-slate-50 border border-slate-100 p-5 rounded-2xl">
                    <p className="text-sm font-semibold text-slate-600 mb-4">Discuss these questions with your group members:</p>
                    <ul className="space-y-3">
                      {dailyTopic.questions.map((q, idx) => (
                        <li key={idx} className="flex gap-3 text-slate-700 text-sm md:text-base items-start">
                          <span className="font-bold text-blue-500 bg-blue-100 w-6 h-6 rounded-full flex items-center justify-center shrink-0">{idx + 1}</span> 
                          <span className="mt-0.5">{q}</span>
                        </li>
                      ))}
                    </ul>
                  </div>
                </section>
              </main>
            </div>
          );
        }

        // ==========================================
        // 2. GROUP CHAT & VOICE ROOM COMPONENT
        // ==========================================
        function GroupRoomView({ navigate, groupName }) {
          const [message, setMessage] = useState('');
          const [voiceActive, setVoiceActive] = useState(false);
          const [micMuted, setMicMuted] = useState(false);
          const endRef = useRef(null);
          
          const [messages, setMessages] = useState([
            { id: 1, text: "Hello everyone! Ready to practice today's topic?", sender: 'Sarah', time: '10:00 AM', isMe: false },
            { id: 2, text: "Yes, I am ready. The topic is about daily routine.", sender: 'You', time: '10:05 AM', isMe: true },
          ]);

          useEffect(() => {
            endRef.current?.scrollIntoView({ behavior: "smooth" });
          }, [messages]);

          const handleSend = (e) => {
            e.preventDefault();
            if (!message.trim()) return;
            setMessages([...messages, { 
              id: Date.now(), text: message, sender: 'You', 
              time: new Date().toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'}), isMe: true 
            }]);
            setMessage('');
          };

          return (
            <div className="flex h-screen bg-slate-50">
              <div className="flex-1 flex flex-col max-w-4xl mx-auto bg-white shadow-xl shadow-slate-200/50 relative">
                
                <header className="h-20 border-b border-slate-100 px-4 md:px-6 flex items-center justify-between bg-white z-10">
                  <div className="flex items-center gap-3 md:gap-4">
                    <button onClick={() => navigate('home')} className="p-2 hover:bg-slate-100 rounded-full text-slate-500 transition-colors shrink-0 flex items-center justify-center">
                      <ArrowLeft />
                    </button>
                    <div className="w-10 h-10 md:w-12 md:h-12 rounded-full bg-blue-100 flex items-center justify-center text-blue-600 font-bold text-lg shrink-0">
                      {groupName ? groupName.charAt(0) : 'G'}
                    </div>
                    <div className="overflow-hidden">
                      <h2 className="font-bold text-slate-800 text-base md:text-lg truncate">{groupName || "Group Name"}</h2>
                      <p className="text-xs text-green-500 font-semibold flex items-center gap-1.5 mt-0.5">
                        <span className="w-2 h-2 rounded-full bg-green-500 animate-pulse"></span> 5 Members Online
                      </p>
                    </div>
                  </div>
                  
                  <div className="flex items-center gap-2 md:gap-3 shrink-0">
                    <button 
                      onClick={() => setVoiceActive(true)}
                      className="bg-green-500 hover:bg-green-600 text-white px-3 md:px-5 py-2 md:py-2.5 rounded-full font-bold flex items-center gap-2 text-sm transition-all shadow-lg shadow-green-200">
                      <PhoneCall /> <span className="hidden md:inline">Join Voice</span>
                    </button>
                    <button className="text-xl text-slate-400 p-2 hover:bg-slate-100 rounded-full hidden md:block"><MoreVertical/></button>
                  </div>
                </header>

                <div className="flex-1 overflow-y-auto p-4 md:p-6 space-y-5 bg-slate-50/50">
                  {messages.map(msg => (
                    <div key={msg.id} className={`flex flex-col ${msg.isMe ? 'items-end' : 'items-start'}`}>
                      {!msg.isMe && <span className="text-xs font-semibold text-slate-500 ml-2 mb-1">{msg.sender}</span>}
                      <div className={`max-w-[85%] md:max-w-[60%] px-5 py-3 rounded-2xl text-[15px] shadow-sm ${
                        msg.isMe ? 'bg-blue-600 text-white rounded-br-sm' : 'bg-white border border-slate-200 text-slate-800 rounded-bl-sm'
                      }`}>
                        {msg.text}
                      </div>
                      <span className="text-[10px] font-medium text-slate-400 mt-1 mx-2">{msg.time}</span>
                    </div>
                  ))}
                  <div ref={endRef} />
                </div>

                <footer className="p-4 bg-white border-t border-slate-100">
                  <form onSubmit={handleSend} className="flex items-center gap-2 md:gap-3">
                    <button type="button" className="p-2 md:p-3 text-slate-400 hover:text-blue-600 hover:bg-blue-50 rounded-full transition-all shrink-0"><Paperclip/></button>
                    <input 
                      type="text" 
                      value={message}
                      onChange={(e) => setMessage(e.target.value)}
                      placeholder="Type a message..." 
                      className="flex-1 bg-slate-100 text-slate-800 rounded-full px-4 md:px-6 py-3 outline-none focus:ring-2 focus:ring-blue-500/20 focus:bg-white border border-transparent focus:border-blue-500 transition-all text-sm md:text-base"
                    />
                    {message.trim() ? (
                      <button type="submit" className="p-3 md:p-4 bg-blue-600 text-white rounded-full hover:bg-blue-700 transition-colors shadow-md shadow-blue-200 shrink-0">
                        <Send />
                      </button>
                    ) : (
                      <button type="button" className="p-3 md:p-4 bg-slate-100 text-slate-600 rounded-full hover:bg-slate-200 transition-colors shrink-0">
                        <Mic />
                      </button>
                    )}
                  </form>
                </footer>
              </div>

              {/* Voice Room Overlay */}
              {voiceActive && (
                <div className="absolute inset-0 z-50 flex items-center justify-center bg-slate-900/60 backdrop-blur-sm p-4">
                  <div className="bg-white w-full max-w-md rounded-[2rem] shadow-2xl overflow-hidden flex flex-col">
                    <div className="bg-blue-600 p-6 text-center relative">
                      <h3 className="text-white font-bold text-xl mb-1">Group Voice Practice</h3>
                      <p className="text-blue-200 text-sm font-medium">Topic: Daily Routine</p>
                    </div>
                    
                    <div className="p-8 flex-1 bg-slate-50">
                      <div className="grid grid-cols-2 gap-6">
                        <div className="flex flex-col items-center">
                          <div className="w-24 h-24 rounded-full bg-blue-100 border-[3px] border-green-500 p-1 mb-3 relative shadow-lg shadow-green-200">
                            <img src="https://ui-avatars.com/api/?name=Sarah&background=random" className="w-full h-full rounded-full" alt="Sarah" />
                            <div className="absolute bottom-0 right-0 bg-green-500 rounded-full p-1.5 border-2 border-white text-white text-xs"><Mic/></div>
                          </div>
                          <p className="text-sm font-bold text-slate-700">Sarah</p>
                          <p className="text-[10px] text-green-600 font-bold uppercase tracking-wider mt-1">Speaking...</p>
                        </div>
                        <div className="flex flex-col items-center">
                          <div className="w-24 h-24 rounded-full bg-slate-200 p-1 mb-3 relative opacity-80">
                            <img src="https://ui-avatars.com/api/?name=You" className="w-full h-full rounded-full" alt="You" />
                            {micMuted && <div className="absolute bottom-0 right-0 bg-red-500 rounded-full p-1.5 border-2 border-white text-white text-xs"><MicOff/></div>}
                          </div>
                          <p className="text-sm font-bold text-slate-700">You</p>
                        </div>
                      </div>
                    </div>

                    <div className="p-6 bg-white border-t border-slate-100 flex items-center justify-center gap-6">
                      <button onClick={() => setMicMuted(!micMuted)} className={`p-4 rounded-full transition-all text-xl ${micMuted ? 'bg-red-100 text-red-500' : 'bg-slate-100 text-slate-700 hover:bg-slate-200'}`}>
                        {micMuted ? <MicOff/> : <Mic/>}
                      </button>
                      <button onClick={() => setVoiceActive(false)} className="px-8 py-4 bg-red-500 hover:bg-red-600 text-white rounded-full font-bold shadow-lg shadow-red-200 flex items-center gap-2 transition-all">
                        <PhoneOff/> Leave Room
                      </button>
                    </div>
                  </div>
                </div>
              )}
            </div>
          );
        }

        // ==========================================
        // 3. ADMIN / TEACHER COMPONENT
        // ==========================================
        function AdminView({ navigate }) {
          const [topic, setTopic] = useState('');
          const [questions, setQuestions] = useState(['', '', '']);
          const [success, setSuccess] = useState(false);

          const handlePublish = (e) => {
            e.preventDefault();
            setSuccess(true);
            setTimeout(() => setSuccess(false), 3000);
          };

          return (
            <div className="min-h-screen bg-slate-50 p-5 md:p-10">
              <div className="max-w-5xl mx-auto">
                <header className="mb-10 flex flex-col md:flex-row md:items-center justify-between gap-4">
                  <div className="flex items-center gap-4">
                    <button onClick={() => navigate('home')} className="bg-white w-10 h-10 rounded-full shadow-sm hover:bg-slate-100 transition-colors shrink-0 flex items-center justify-center">
                      <ArrowLeft />
                    </button>
                    <div>
                      <h1 className="text-2xl md:text-3xl font-bold text-slate-800">Teacher Dashboard</h1>
                      <p className="text-slate-500 font-medium text-sm md:text-base">Manage Rayhan’s English Academy</p>
                    </div>
                  </div>
                </header>

                <div className="grid grid-cols-1 lg:grid-cols-2 gap-8">
                  <section className="bg-white p-6 md:p-8 rounded-3xl shadow-sm border border-slate-200">
                    <h2 className="text-xl font-bold mb-6 flex items-center gap-2"><BookOpen /> Publish Daily Topic</h2>
                    <form onSubmit={handlePublish} className="space-y-5">
                      <div>
                        <label className="block text-sm font-bold text-slate-700 mb-2">Topic Title</label>
                        <input type="text" className="w-full bg-slate-50 border border-slate-200 rounded-xl px-4 py-3 outline-none focus:ring-2 focus:ring-blue-500/20 focus:border-blue-500 transition-all" placeholder="e.g. My Favorite Hobby" value={topic} onChange={(e) => setTopic(e.target.value)} required />
                      </div>
                      <button type="submit" className={`w-full font-bold py-4 rounded-xl transition-all flex items-center justify-center gap-2 ${success ? 'bg-green-500 hover:bg-green-600' : 'bg-blue-600 hover:bg-blue-700'} text-white shadow-lg`}>
                        {success ? <CheckCircle /> : null}
                        {success ? 'Topic Published Successfully!' : 'Publish to All Groups'}
                      </button>
                    </form>
                  </section>
                </div>
              </div>
            </div>
          );
        }

        // ==========================================
        // 4. MAIN APP ROUTER
        // ==========================================
        function App() {
          const [currentView, setCurrentView] = useState('home');
          const [currentGroup, setCurrentGroup] = useState({ id: null, name: '' });
          
          // গ্লোবাল স্টেট (যাতে গ্রুপ ক্রিয়েট করলে লিস্টে থেকে যায়)
          const [groups, setGroups] = useState([
            { id: 'beginner-spoken', name: 'Beginner Spoken English', members: 12, unread: 2 },
            { id: 'ielts-practice', name: 'IELTS Speaking Practice', members: 8, unread: 0 },
          ]);

          const navigate = (view, groupId = null, groupName = '') => {
            if (view === 'group') {
              setCurrentGroup({ id: groupId, name: groupName });
            }
            setCurrentView(view);
          };

          return (
            <React.Fragment>
              {currentView === 'home' && <HomeView navigate={navigate} groups={groups} setGroups={setGroups} />}
              {currentView === 'group' && <GroupRoomView navigate={navigate} groupName={currentGroup.name} />}
              {currentView === 'admin' && <AdminView navigate={navigate} />}
            </React.Fragment>
          );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
