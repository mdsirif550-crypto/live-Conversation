<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rayhan's English Academy - Live Chat</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- React & Babel -->
    <script src="https://unpkg.com/react@18/umd/react.development.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js" crossorigin></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <!-- Firebase SDK (Very Important for Live Chat) -->
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>
</head>
<body class="bg-slate-50 text-slate-800 antialiased">
    
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef } = React;

        // ==========================================
        // 🔥 FIREBASE SETUP (আপনাকে এখানে আপনার কোড বসাতে হবে)
        // ==========================================
        const firebaseConfig = {
            apiKey: "YOUR_API_KEY",
            authDomain: "YOUR_PROJECT_ID.firebaseapp.com",
            projectId: "YOUR_PROJECT_ID",
            storageBucket: "YOUR_PROJECT_ID.appspot.com",
            messagingSenderId: "YOUR_SENDER_ID",
            appId: "YOUR_APP_ID"
        };

        // Initialize Firebase
        if (!firebase.apps.length) {
            firebase.initializeApp(firebaseConfig);
        }
        const db = firebase.firestore();

        // Icons using Emojis
        const BookOpen = () => <span className="text-xl">📖</span>;
        const Users = () => <span className="text-xl">👥</span>;
        const Plus = () => <span>➕</span>;
        const LogOut = () => <span>🚪</span>;
        const Shield = () => <span>🛡️</span>;
        const ArrowLeft = () => <span className="text-xl">⬅️</span>;
        const PhoneCall = () => <span>📞</span>;
        const Send = () => <span>📤</span>;
        const Mic = () => <span>🎤</span>;
        const PhoneOff = () => <span>❌</span>;

        // ==========================================
        // 1. HOME COMPONENT
        // ==========================================
        function HomeView({ navigate, currentUser }) {
          const [groups, setGroups] = useState([]);

          // লাইভ ফায়ারবেজ থেকে গ্রুপ লোড করা
          useEffect(() => {
            const unsubscribe = db.collection('groups').orderBy('createdAt', 'desc').onSnapshot(snapshot => {
              const groupList = [];
              snapshot.forEach(doc => groupList.push({ id: doc.id, ...doc.data() }));
              setGroups(groupList);
            }, (error) => {
              console.log("Firebase Database Error:", error.message);
            });
            return () => unsubscribe();
          }, []);

          const handleCreateGroup = () => {
            const groupName = prompt("নতুন গ্রুপের নাম দিন:");
            if(groupName) {
              db.collection('groups').add({
                name: groupName,
                members: 1,
                createdAt: firebase.firestore.FieldValue.serverTimestamp()
              });
            }
          };

          return (
            <div className="min-h-screen bg-slate-50 flex flex-col md:flex-row">
              <nav className="w-full md:w-72 bg-white border-r border-slate-200 p-5 flex flex-col justify-between shadow-sm z-10 sticky top-0 md:h-screen">
                <div>
                  <div className="flex items-center gap-3 mb-8">
                    <div className="bg-blue-600 p-2 rounded-xl text-white shadow-md"><BookOpen /></div>
                    <div>
                      <h1 className="font-bold text-xl leading-tight text-blue-900">Rayhan's</h1>
                      <p className="text-xs text-slate-500 font-bold tracking-wide">ENGLISH ACADEMY</p>
                    </div>
                  </div>
                  
                  <button onClick={handleCreateGroup} className="w-full bg-blue-600 hover:bg-blue-700 text-white font-medium py-3 px-4 rounded-xl flex items-center justify-center gap-2 mb-8 transition-all shadow-md">
                    <Plus /> Create Group
                  </button>

                  <h3 className="text-sm font-semibold text-slate-400 uppercase tracking-wider mb-3">Live Groups (Global)</h3>
                  <div className="space-y-2 overflow-y-auto max-h-[50vh]">
                    {groups.length === 0 && <p className="text-xs text-slate-400">No groups found. Create one!</p>}
                    {groups.map(g => (
                      <button key={g.id} onClick={() => navigate('group', g.id, g.name)} className="w-full text-left flex items-center gap-3 p-3 rounded-xl hover:bg-blue-50 border border-slate-100 hover:border-blue-200 transition-colors">
                        <div className="w-10 h-10 rounded-full bg-blue-100 flex items-center justify-center text-blue-600 font-bold shrink-0">
                          {g.name.charAt(0).toUpperCase()}
                        </div>
                        <div className="overflow-hidden">
                          <p className="text-sm font-bold text-slate-700 truncate">{g.name}</p>
                          <p className="text-xs text-green-500 font-medium">Click to join chat</p>
                        </div>
                      </button>
                    ))}
                  </div>
                </div>

                <div className="mt-8 border-t border-slate-100 pt-5">
                  <div className="flex items-center gap-3 bg-slate-50 border border-slate-200 p-3 rounded-xl">
                    <div className="w-10 h-10 rounded-full bg-green-200 flex items-center justify-center text-xl">👤</div>
                    <div className="flex-1 overflow-hidden">
                      <p className="text-sm font-bold text-slate-800 truncate">{currentUser}</p>
                      <p className="text-xs text-green-600 font-bold">Online</p>
                    </div>
                  </div>
                </div>
              </nav>

              <main className="flex-1 p-5 md:p-10 flex flex-col items-center justify-center">
                <div className="text-center max-w-lg">
                  <h2 className="text-3xl font-bold text-slate-800 mb-4">Welcome, {currentUser}! 👋</h2>
                  <p className="text-slate-500 mb-8">This app is now connected to live Firebase. Create a group on the left or join an existing one to chat with others in real-time.</p>
                  <div className="bg-blue-50 p-6 rounded-2xl border border-blue-100">
                    <h3 className="font-bold text-blue-800 mb-2">How to test with your friend:</h3>
                    <p className="text-sm text-blue-600">Send this website link to your friend. Both of you click on the same group name from the left menu. Whatever you type, they will see instantly!</p>
                  </div>
                </div>
              </main>
            </div>
          );
        }

        // ==========================================
        // 2. LIVE CHAT & VOICE COMPONENT
        // ==========================================
        function GroupRoomView({ navigate, groupId, groupName, currentUser }) {
          const [message, setMessage] = useState('');
          const [messages, setMessages] = useState([]);
          const [voiceActive, setVoiceActive] = useState(false);
          const [micStream, setMicStream] = useState(null);
          const endRef = useRef(null);

          // লাইভ মেসেজ শোনা (Firebase Listener)
          useEffect(() => {
            if (!groupId) return;
            const unsubscribe = db.collection('groups').doc(groupId).collection('messages')
              .orderBy('timestamp', 'asc')
              .onSnapshot(snapshot => {
                const msgs = [];
                snapshot.forEach(doc => msgs.push({ id: doc.id, ...doc.data() }));
                setMessages(msgs);
                setTimeout(() => endRef.current?.scrollIntoView({ behavior: "smooth" }), 100);
              });
            return () => unsubscribe();
          }, [groupId]);

          const handleSend = (e) => {
            e.preventDefault();
            if (!message.trim()) return;
            
            // ফায়ারবেজে মেসেজ পাঠানো
            db.collection('groups').doc(groupId).collection('messages').add({
              text: message,
              sender: currentUser, // যে মেসেজ দিচ্ছে তার নাম
              time: new Date().toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'}),
              timestamp: firebase.firestore.FieldValue.serverTimestamp()
            });
            setMessage('');
          };

          // ডেমো ভয়েস রুম (মাইক্রোফোন পারমিশন)
          const joinVoiceRoom = async () => {
            setVoiceActive(true);
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
                setMicStream(stream);
            } catch(err) {
                alert("Microphone access denied! To use voice features, you must allow microphone access.");
            }
          };

          const leaveVoiceRoom = () => {
            if(micStream) {
                micStream.getTracks().forEach(track => track.stop());
            }
            setVoiceActive(false);
          };

          return (
            <div className="flex h-screen bg-slate-50">
              <div className="flex-1 flex flex-col max-w-4xl mx-auto bg-white shadow-xl shadow-slate-200/50 relative border-x border-slate-200">
                <header className="h-20 border-b border-slate-200 px-4 flex items-center justify-between bg-white z-10">
                  <div className="flex items-center gap-3">
                    <button onClick={() => navigate('home')} className="w-10 h-10 bg-slate-100 hover:bg-slate-200 rounded-full flex items-center justify-center shrink-0">
                      <ArrowLeft />
                    </button>
                    <div>
                      <h2 className="font-bold text-slate-800 text-lg">{groupName}</h2>
                      <p className="text-xs text-green-500 font-bold">🟢 Live Global Chat</p>
                    </div>
                  </div>
                  <button onClick={joinVoiceRoom} className="bg-green-500 hover:bg-green-600 text-white px-5 py-2.5 rounded-full font-bold flex items-center gap-2 text-sm shadow-md transition-all">
                    <PhoneCall /> Voice Room
                  </button>
                </header>

                <div className="flex-1 overflow-y-auto p-4 space-y-4 bg-slate-50">
                  {messages.length === 0 && <p className="text-center text-slate-400 mt-10">Say hello to the group!</p>}
                  
                  {messages.map(msg => {
                    const isMe = msg.sender === currentUser; // চেক করা হচ্ছে মেসেজটা আমার কি না
                    return (
                      <div key={msg.id} className={`flex flex-col ${isMe ? 'items-end' : 'items-start'}`}>
                        {!isMe && <span className="text-xs font-bold text-slate-500 ml-2 mb-1">{msg.sender}</span>}
                        <div className={`max-w-[75%] px-5 py-3 rounded-2xl text-[15px] shadow-sm ${
                          isMe ? 'bg-blue-600 text-white rounded-br-sm' : 'bg-white border border-slate-200 text-slate-800 rounded-bl-sm'
                        }`}>
                          {msg.text}
                        </div>
                        <span className="text-[10px] font-medium text-slate-400 mt-1 mx-2">{msg.time}</span>
                      </div>
                    );
                  })}
                  <div ref={endRef} />
                </div>

                <footer className="p-4 bg-white border-t border-slate-200">
                  <form onSubmit={handleSend} className="flex items-center gap-2">
                    <input 
                      type="text" 
                      value={message}
                      onChange={(e) => setMessage(e.target.value)}
                      placeholder="Type a live message..." 
                      className="flex-1 bg-slate-100 rounded-full px-5 py-3 outline-none focus:ring-2 focus:ring-blue-500/20 focus:bg-white border border-transparent focus:border-blue-500 transition-all font-medium"
                    />
                    <button type="submit" className="w-12 h-12 bg-blue-600 text-white rounded-full hover:bg-blue-700 flex items-center justify-center transition-all shadow-md shrink-0">
                      <Send />
                    </button>
                  </form>
                </footer>
              </div>

              {/* Voice Room */}
              {voiceActive && (
                <div className="absolute inset-0 z-50 flex items-center justify-center bg-slate-900/80 backdrop-blur-sm p-4">
                  <div className="bg-white w-full max-w-md rounded-3xl shadow-2xl overflow-hidden flex flex-col">
                    <div className="bg-blue-600 p-6 text-center">
                      <h3 className="text-white font-bold text-xl mb-1">Live Voice Room</h3>
                      <p className="text-blue-200 text-sm font-medium">{groupName}</p>
                    </div>
                    
                    <div className="p-8 flex-1 bg-slate-50 flex flex-col items-center justify-center py-10">
                       <div className="w-24 h-24 rounded-full bg-slate-200 border-4 border-white shadow-lg flex items-center justify-center text-4xl mb-4 relative">
                           👤
                           {micStream && <span className="absolute bottom-0 right-0 bg-green-500 p-1.5 rounded-full text-white text-xs animate-bounce"><Mic/></span>}
                       </div>
                       <p className="font-bold text-slate-700">{currentUser} (You)</p>
                       <p className="text-xs text-green-600 font-bold mt-2">
                         {micStream ? "Microphone is ON 🎤" : "Connecting..."}
                       </p>
                    </div>

                    <div className="p-6 bg-white border-t border-slate-100 flex items-center justify-center">
                      <button onClick={leaveVoiceRoom} className="w-full py-4 bg-red-500 hover:bg-red-600 text-white rounded-2xl font-bold shadow-lg shadow-red-200 flex items-center justify-center gap-2 transition-all">
                        <PhoneOff/> End Call
                      </button>
                    </div>
                  </div>
                </div>
              )}
            </div>
          );
        }

        // ==========================================
        // 3. MAIN APP (Starts here)
        // ==========================================
        function App() {
          const [currentUser, setCurrentUser] = useState(null);
          const [currentView, setCurrentView] = useState('home');
          const [currentGroup, setCurrentGroup] = useState({ id: null, name: '' });

          // শুরুতে নাম জিজ্ঞেস করা হবে
          useEffect(() => {
            const storedName = localStorage.getItem('rayhan_username');
            if (storedName) {
                setCurrentUser(storedName);
            } else {
                const name = prompt("আপনার নাম লিখুন (যাতে অন্য মানুষ আপনাকে চিনতে পারে):");
                if (name && name.trim() !== '') {
                    localStorage.setItem('rayhan_username', name);
                    setCurrentUser(name);
                } else {
                    setCurrentUser("Guest" + Math.floor(Math.random() * 1000));
                }
            }
          }, []);

          const navigate = (view, groupId = null, groupName = '') => {
            if (view === 'group') {
              setCurrentGroup({ id: groupId, name: groupName });
            }
            setCurrentView(view);
          };

          if (!currentUser) return <div className="h-screen flex items-center justify-center">Loading...</div>;

          return (
            <React.Fragment>
              {currentView === 'home' && <HomeView navigate={navigate} currentUser={currentUser} />}
              {currentView === 'group' && <GroupRoomView navigate={navigate} groupId={currentGroup.id} groupName={currentGroup.name} currentUser={currentUser} />}
            </React.Fragment>
          );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
